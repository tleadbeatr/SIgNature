<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeASURe SIgNature</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            line-height: 1.6;
            color: #222;
            background: #fafafa;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.2rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 2.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: white;
        }

        button {
            margin-top: 1rem;
            padding: 0.8rem 1.4rem;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            background: #444;
        }

        .example {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            color: #777;
        }

        #result {
            margin-top: 2.5rem;
            padding: 1.5rem;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <h1>MeASURe SIgNature</h1>

    <p class="subtitle">
        Turn your name into a physical expression.
    </p>

    <form id="signature-form">

        <label for="signature">
            What is your SIgNature?
        </label>

        <input
            type="text"
            id="signature"
            name="signature"
            placeholder="e.g. K s^-1"
            autocomplete="off"
            required
        >

        <div class="example">
            Try something like <code>K s^-1</code>,
            <code>K/s</code>, or <code>(K Ω)/H</code>.
        </div>

        <button type="submit">
            MeASURe
        </button>

    </form>

    <div id="result" class="hidden"></div>

    <script>
        const form = document.getElementById("signature-form");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const signature =
                document.getElementById("signature").value.trim();

            if (!signature) {
                return;
            }

            result.classList.remove("hidden");
            result.textContent = "MeASURe-ment in progress...";

            try {
                const response = await fetch("/analyse", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        signature: signature
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong.");
                }

                result.textContent = data.result;

            } catch (error) {
                result.textContent =
                    "The MeASURe-ment failed.\n\n" + error.message;
            }
        });
    </script>

</body>
</html>
