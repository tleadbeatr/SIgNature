<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeASURe SIgNature</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 0.2em;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 2em;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
        }

        .examples {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            white-space: pre-wrap;
            border-left: 4px solid #444;
            background: #f5f5f5;
            min-height: 1.5em;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <h1>MeASURe SIgNature</h1>

    <p class="subtitle">
        Turn your name into a physical expression.
    </p>

    <form id="signature-form">

        <input
            id="signature"
            name="signature"
            type="text"
            placeholder="Enter your SIgNature"
            autocomplete="off"
            required
        >

        <div class="examples">
            Try: TWL [K Ω / H] = K s<sup>-1</sup> &nbsp; | &nbsp;
            TH [T<sub>tof</sub> / t<sub>1/2</sub>] &nbsp; | &nbsp;
            GPT [G π / k<sub>B</sub>] = m kg<sup>-2</sup> K
        </div>

        <button type="submit">
            MeASURe
        </button>

    </form>

    <div id="result" class="hidden"></div>

    <!-- Measurement comedy engine -->
    <script src="measurement-messages.js"></script>
    <script src="measurement-theatre.js"></script>

    <script>
        const form = document.getElementById("signature-form");
        const signatureInput = document.getElementById("signature");
        const result = document.getElementById("result");
        const button = form.querySelector("button");
        
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const signature = signatureInput.value.trim();

            if (!signature) {
                return;
            }

            // disable button while theatre runs
            button.disabled = true;
            
                // Clear any previous result
            result.textContent = "";
            result.classList.remove("hidden");

            /*
             * Start the measurement theatre immediately.
             * It runs independently while the AI request is being processed.
             */
            const theatre = runMeasurementTheatre({
                signature: signature,
                element: result
            });

            try {
                const response = await fetch("/analyse", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        signature: signature
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Something went wrong."
                    );
                }

                /*
                 * Tell the theatre that the result is ready.
                 * The theatre decides when the dramatic reveal happens.
                 */
                theatre.complete();

                await theatre.promise;

                /*
                 * Only reveal the AI interpretation after
                 * the measurement theatre has finished.
                 */
                result.textContent += "\n\nAI interpretation:\n\n" + data.result;

            } catch (error) {

                theatre.complete();

                await theatre.promise;
                result.textContent += "\n\nThe MeASURe-ment failed.\n\n" + error.message;
            }

            button.disabled = false;
        });
    </script>

</body>
</html>
